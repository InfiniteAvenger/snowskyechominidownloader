; SnowskyEchoFileDownloader Configuration
; ========================================

[download_dirs]
; Base output directory - set this to your Echo Mini drive letter
; e.g. G:\ for the Snowsky Echo Mini, or any local folder
base = G:\

; Subdirectories (relative to base) matching Echo Mini layout
songs = %(base)s\Songs
albums = %(base)s\Albums
playlists = %(base)s\Playlists
youtubedl = %(base)s\Youtube-dl
zips = %(base)s\Zips

[http]
host = 127.0.0.1
port = 5000

[proxy]
; Optional proxy: https://user:pass@host:port or socks5://127.0.0.1:9050
server =

[threadpool]
; Max parallel downloads
workers = 4

[deezer]
; Login to deezer.com in your browser, then copy the 'arl' cookie value here
cookie_arl =b2dc74ff4b351970688e344429868919fb2660e58e125e5d8f06cbedae31bc771855b417d6f76aea3c90ade63216766507c6d018f9796e42d278438fcd6626549d1cfa8b564d98c37a2f7b7b91b0078b244b2609660833ec47173c7843987606

; mp3 or flac (flac requires Deezer Premium)
quality = flac

; === Optional: Synchronized Lyrics (LRC) ===
; Uncomment and fill these to enable .lrc lyric downloads
;cookie_fixed_jwt = "your_jwt_here"
;cookie_refresh_token_D = "your_refresh_token_deezer_here"
;cookie_refresh_token = "your_refresh_token_here"

[youtubedl]
; Path to yt-dlp executable
; On Windows, if yt-dlp is in PATH, just use: yt-dlp
command = yt-dlp
